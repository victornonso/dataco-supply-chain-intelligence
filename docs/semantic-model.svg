<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5a6952"/></marker></defs><rect width="1200" height="920" fill="#f5f4ef"/><g font-family="Arial,sans-serif" fill="#20241f"><text x="40" y="58" font-size="29" font-weight="bold">One transactional fact. Seven dimensions.</text><text x="40" y="96" font-size="18">Active relationships • single-direction filters • one row per order item</text><path d="M 360 220 L 430 220" fill="none" stroke="#5a6952" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="160" width="320" height="120" rx="5" fill="#ffffff" stroke="#cdd1c7"/><text x="60" y="195" font-size="23" font-weight="bold">DimDate <tspan fill="#65715b">1</tspan></text><text x="60" y="227" font-size="17">OrderDateKey → DateKey</text><text x="60" y="256" font-size="17" fill="#606859">Order-date filtering</text><path d="M 360 405 L 430 405" fill="none" stroke="#5a6952" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="345" width="320" height="120" rx="5" fill="#ffffff" stroke="#cdd1c7"/><text x="60" y="380" font-size="23" font-weight="bold">DimCustomer <tspan fill="#65715b">1</tspan></text><text x="60" y="412" font-size="17">CustomerKey</text><text x="60" y="441" font-size="17" fill="#606859">Customer / segment</text><path d="M 360 590 L 430 590" fill="none" stroke="#5a6952" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="530" width="320" height="120" rx="5" fill="#ffffff" stroke="#cdd1c7"/><text x="60" y="565" font-size="23" font-weight="bold">DimProduct <tspan fill="#65715b">1</tspan></text><text x="60" y="597" font-size="17">ProductKey</text><text x="60" y="626" font-size="17" fill="#606859">Product / category</text><path d="M 840 220 L 770 220" fill="none" stroke="#5a6952" stroke-width="2" marker-end="url(#arrow)"/><rect x="840" y="160" width="320" height="120" rx="5" fill="#ffffff" stroke="#cdd1c7"/><text x="860" y="195" font-size="23" font-weight="bold">DimLocation <tspan fill="#65715b">1</tspan></text><text x="860" y="227" font-size="17">LocationKey</text><text x="860" y="256" font-size="17" fill="#606859">Country / market</text><path d="M 840 405 L 770 405" fill="none" stroke="#5a6952" stroke-width="2" marker-end="url(#arrow)"/><rect x="840" y="345" width="320" height="120" rx="5" fill="#ffffff" stroke="#cdd1c7"/><text x="860" y="380" font-size="23" font-weight="bold">DimShipping <tspan fill="#65715b">1</tspan></text><text x="860" y="412" font-size="17">ShippingKey</text><text x="860" y="441" font-size="17" fill="#606859">Shipping mode</text><path d="M 840 590 L 770 590" fill="none" stroke="#5a6952" stroke-width="2" marker-end="url(#arrow)"/><rect x="840" y="530" width="320" height="120" rx="5" fill="#ffffff" stroke="#cdd1c7"/><text x="860" y="565" font-size="23" font-weight="bold">DimDepartment <tspan fill="#65715b">1</tspan></text><text x="860" y="597" font-size="17">DepartmentKey</text><text x="860" y="626" font-size="17" fill="#606859">Department</text><path d="M 600 690 L 600 650" fill="none" stroke="#5a6952" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="690" width="320" height="120" rx="5" fill="#ffffff" stroke="#cdd1c7"/><text x="460" y="725" font-size="23" font-weight="bold">DimPayment <tspan fill="#65715b">1</tspan></text><text x="460" y="757" font-size="17">PaymentKey</text><text x="460" y="786" font-size="17" fill="#606859">Payment type</text><rect x="430" y="160" width="340" height="490" rx="5" fill="#202820"/><rect x="430" y="160" width="340" height="8" fill="#b9de58"/><g fill="#f6f6ee"><text x="455" y="208" font-size="26" font-weight="bold">FactOrderItem *</text><text x="455" y="250" font-size="18">180,519 unique order items</text><text x="455" y="280" font-size="18">65,752 distinct orders</text><text x="455" y="332" font-size="19">OrderItemId / OrderId</text><text x="455" y="367" font-size="19">Sales / OrderItemTotal</text><text x="455" y="402" font-size="19">OrderItemDiscount</text><text x="455" y="437" font-size="19">OrderProfitPerOrder</text><text x="455" y="472" font-size="19">DaysForShippingReal</text><text x="455" y="507" font-size="19">DaysForShipScheduled</text><text x="455" y="542" font-size="19">DeliveryStatus</text><text x="455" y="597" font-size="17" fill="#b9de58">* Many order items per key</text></g><text x="40" y="855" font-size="18">Arrows show filter direction: dimensions → fact. All seven paths are active, many-to-one.</text><text x="40" y="884" font-size="18" fill="#606859">OrderDateKey is active; ShipDateKey has no relationship. Automatic date tables omitted for clarity.</text></g></svg>